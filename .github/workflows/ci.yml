name: CI

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          python -m pip install ".[api,dev]"

      - name: Static checks
        run: |
          python -m compileall -q .
          ruff check cli.py constant_time_crypto_verifier.py agents/base.py agents/api.py agents/llm_factory.py agents/models.py agents/supervisor.py agents/workers.py tests/test_constant_time_crypto_engine.py tests/test_constant_time_crypto_verifier.py tests/test_cli_core.py

      - name: Unit tests
        run: python -m pytest

      - name: Installed CLI smoke test
        run: |
          constant-time-crypto-verifier --help
          constant-time-crypto-verifier batch -i sample.csv -o out_smoke.csv
          test -s out_smoke.csv
          rm -f out_smoke.csv

      - name: Build distribution
        run: python -m build

      - name: Dependency audit
        run: pip-audit --skip-editable
